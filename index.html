<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Nutrition App</title>
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="row">
    <div class="logo">🍼</div>
    <div>
      <h1>Nutrition App</h1>
      <p>اختر الموضوع، افتح ملف النشاط، وراجع المحاور قبل التنفيذ</p>
    </div>
    <a class="adminlink" href="admin.html">🔐 دخول المشرف</a>
  </div>
</div></div>

<div class="wrap">
  <div class="search"><span>🔎</span><input id="q" type="search" placeholder="ابحث عن موضوع أو محور..." autocomplete="off"></div>
  <div class="syncbar">
    <span class="st" id="st"></span>
    <button class="pill" id="refresh">🔄 تحديث</button>
    <button class="pill" id="install" hidden>📲 تثبيت التطبيق</button>
  </div>
  <div class="hint2" id="iosHint" hidden>للتثبيت على الآيفون: اضغط زر المشاركة ثم «إضافة إلى الشاشة الرئيسية».</div>
  <div class="chips" id="chips"></div>
  <div class="count" id="count"></div>
  <div id="list" class="grid"><div class="loading" style="grid-column:1/-1">جارٍ تحميل المواضيع...</div></div>
</div>

<div class="lb" id="lb"><button class="x lbx" onclick="lbClose()">✕</button><button class="lbn lbp" onclick="lbStep(1)">‹</button><img id="lbImg" alt=""><button class="lbn lbq" onclick="lbStep(-1)">›</button></div>

<script src="shared.js"></script>
<script src="app.js"></script>
</body>
</html>
