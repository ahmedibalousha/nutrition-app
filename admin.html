<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>لوحة الإضافة - Nutrition App</title>
<meta name="theme-color" content="#0F766E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="hero"><div class="wrap">
  <div class="row">
    <div class="logo">🔐</div>
    <div><h1>لوحة إضافة المواضيع</h1><p>للمشرف والفوكل بوينت فقط</p></div>
  </div>
</div></div>

<div class="wrap">
  <div id="loginBox" class="panel login">
    <label style="margin-top:0">اسم المستخدم</label>
    <input type="text" id="u" autocomplete="username" autocapitalize="off">
    <label>كلمة المرور</label>
    <input type="password" id="p" autocomplete="current-password">
    <button class="btn primary" id="loginBtn" style="width:100%;margin-top:18px">دخول</button>
    <div class="msg" id="loginMsg"></div>
    <div style="text-align:center;margin-top:14px"><a href="index.html" class="meta">← العودة لصفحة المواضيع</a></div>
  </div>

  <div id="app" style="display:none">
    <div class="bar2">
      <div class="who" id="who"></div>
      <a class="btn ghost" style="flex:none" href="index.html">عرض الموقع</a>
      <button class="btn danger" style="flex:none" id="logoutBtn">خروج</button>
    </div>

    <div class="two">
      <div class="panel" id="formPanel">
        <h3 id="formTitle" style="font-size:19px">➕ إضافة موضوع جديد</h3>
        <label>القسم</label>
        <select id="section"></select>
        <details class="sec"><summary>➕ إضافة قسم جديد</summary>
          <input type="text" id="newSecName" placeholder="اسم القسم" style="margin-top:10px">
          <input type="text" id="newSecIcon" placeholder="أيقونة (إيموجي) مثل 🍼" style="margin-top:8px">
          <button class="btn ghost" id="addSecBtn" style="width:100%;margin-top:10px">حفظ القسم</button>
        </details>
        <label>عنوان الموضوع</label>
        <input type="text" id="title">
        <label>تاريخ الموضوع</label>
        <input type="date" id="actDate">
        <label>محاور الموضوع (وصف)</label>
        <textarea id="axes" placeholder="اكتب كل محور في سطر مستقل"></textarea>
        <div class="hint">كل سطر = محور. الترقيم يُضاف تلقائياً، لا حاجة لكتابة 1 و2 و3.</div>
        <label>ملف الموضوع (PDF)</label>
        <div class="file" id="fileBox" onclick="document.getElementById('file').click()">اضغط لاختيار ملف PDF (حتى 20 ميغابايت)</div>
        <input type="file" id="file" accept="application/pdf,.pdf" style="display:none">
        <div class="hint" id="fileHint"></div>
        <label>صور الموضوع (حتى 5 صور)</label>
        <div class="file" id="imgBox" onclick="document.getElementById('imgs').click()">اضغط لاختيار الصور (JPG / PNG)</div>
        <input type="file" id="imgs" accept="image/*" multiple style="display:none">
        <div class="pvs" id="pvs"></div>
        <div style="display:flex;gap:8px;margin-top:18px">
          <button class="btn primary" id="saveBtn">حفظ ونشر</button>
          <button class="btn ghost" id="cancelBtn" style="display:none">إلغاء التعديل</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>

      <div class="panel" id="listPanel">
        <h3 style="font-size:19px;margin-bottom:6px">📚 المواضيع المنشورة</h3>
        <div id="items"><div class="loading">جارٍ التحميل...</div></div>
      </div>
    </div>
    <div class="tabbar" id="tabbar"><button id="tabAdd" class="on" onclick="setTab('add')">➕ إضافة موضوع</button><button id="tabList" onclick="setTab('list')">📚 المنشورة</button></div>
  </div>
</div>

<script src="shared.js"></script>
<script src="admin.js"></script>
</body>
</html>
